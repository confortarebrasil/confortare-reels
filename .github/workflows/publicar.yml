name: Publicar Reel do dia

on:
  schedule:
    - cron: "0 22 * * *" # 22h UTC = 19h de Brasília (Reel do dia)
    # Horários extras (Brasília): 9h, 10h30, 12h, 13h30, 15h, 16h30, 18h, 20h30, 21h30
    # Postam um Reel atrasado por vez; quando não houver atrasados, não fazem nada.
    - cron: "0 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
    - cron: "30 16 * * *"
    - cron: "0 18 * * *"
    - cron: "30 19 * * *"
    - cron: "0 21 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      reel:
        description: "Código do Reel (ex.: R017). Vazio = Reel de hoje"
        required: false
        default: ""
      dry_run:
        description: "true = só testa, não publica"
        required: false
        default: "true"

permissions:
  contents: write

concurrency: publicar

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-auth imageio-ffmpeg
      - name: Publicar
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REEL: ${{ inputs.reel }}
          MODO: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 22 * * *') && 'atrasados' || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python publicar.py
      - name: Guardar registro
        if: success()
        run: |
          git config user.name "confortare-bot"
          git config user.email "confortare-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Registro de publicação" && git pull --rebase && git push)
